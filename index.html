<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ハッタリ・ナンバー — オンライン心理戦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#14120f; --panel:#1e1b17; --panel-2:#262119; --accent:#e8a33d; --accent-dim:#a97427;
    --text:#f1ece1; --muted:#8a8272; --line:#37312a; --alert:#b33a3a; --village:#5c8a6b;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background: radial-gradient(ellipse 700px 500px at 50% -10%, #262019 0%, var(--bg) 60%);
    color:var(--text); font-family:'Shippori Mincho',serif; display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px 16px;
  }
  .mono{ font-family:'JetBrains Mono',monospace; }
  .stage{ width:100%; max-width:440px; }
  .file{ background:var(--panel); border:1px solid var(--line); border-radius:3px; box-shadow:0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03); position:relative; overflow:hidden; }
  .file::before{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 0%, rgba(232,163,61,0.09), transparent 55%); pointer-events:none; }
  .file-body{ padding:32px 28px; position:relative; }
  .kicker{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; color:var(--accent-dim); margin:0 0 6px; }
  h1{ font-size:26px; font-weight:800; margin:0 0 8px; line-height:1.35; }
  h2{ font-size:20px; font-weight:700; margin:0 0 10px; line-height:1.4; }
  p{ margin:0 0 14px; color:var(--text); line-height:1.9; font-size:15px; }
  .muted{ color:var(--muted); font-size:13.5px; }
  .divider{ height:1px; background:var(--line); margin:20px 0; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em; color:var(--muted); margin-bottom:6px; }
  input[type=text], input[type=number]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:2px; color:var(--text);
    font-family:'Shippori Mincho',serif; font-size:15px; padding:10px 12px; outline:none;
  }
  input.mono-input{ font-family:'JetBrains Mono',monospace; font-size:20px; text-align:center; letter-spacing:0.1em; }
  input:focus{ border-color:var(--accent-dim); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; width:100%; background:var(--accent); color:#1a1508;
    border:none; border-radius:2px; padding:13px 18px; font-family:'JetBrains Mono',monospace; font-size:13.5px;
    letter-spacing:0.04em; font-weight:700; cursor:pointer; transition:transform .12s,background .12s;
  }
  .btn:hover{ background:#f0af52; }
  .btn:active{ transform:scale(0.98); }
  .btn.secondary{ background:transparent; color:var(--text); border:1px solid var(--line); }
  .btn.secondary:hover{ border-color:var(--accent-dim); background:rgba(232,163,61,0.06); }
  .btn.danger{ background:var(--alert); color:#fff; }
  .btn.danger:hover{ background:#c94747; }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  .btn-row .btn{ flex:1; }
  .tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tab{ flex:1; text-align:center; padding:10px; border:1px solid var(--line); border-radius:2px; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted); }
  .tab.active{ border-color:var(--accent); color:var(--accent); }
  .errmsg{ color:var(--alert); font-size:13px; margin:-6px 0 14px; font-family:'JetBrains Mono',monospace; }

  .roomcode{ text-align:center; margin:6px 0 20px; }
  .roomcode .code{ font-family:'JetBrains Mono',monospace; font-size:38px; font-weight:700; letter-spacing:0.18em; color:var(--accent); }
  .roomcode .tag{ font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace; letter-spacing:0.1em; }

  .plist{ display:flex; flex-direction:column; gap:8px; margin:14px 0; }
  .prow{ display:flex; align-items:center; justify-content:space-between; background:var(--panel-2); border:1px solid var(--line); padding:10px 14px; border-radius:2px; font-size:14.5px; }
  .prow.turn{ border-color:var(--accent); background:rgba(232,163,61,0.08); }
  .prow.dead{ opacity:0.4; text-decoration:line-through; }
  .hearts{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--alert); letter-spacing:1px; }

  .mycard{ background:var(--panel-2); border:1px dashed var(--line); border-radius:2px; padding:20px 18px; text-align:center; margin:16px 0; }
  .mycard .label{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:0.1em; margin-bottom:8px; }
  .mycard .num{ font-size:44px; font-weight:800; color:var(--accent); font-family:'JetBrains Mono',monospace; }

  .bidbox{ background:var(--panel-2); border:1px solid var(--line); border-radius:2px; padding:16px; text-align:center; margin:14px 0; }
  .bidbox .who{ font-size:12px; color:var(--muted); font-family:'JetBrains Mono',monospace; margin-bottom:4px; }
  .bidbox .val{ font-size:26px; font-weight:800; }

  .log{ max-height:130px; overflow-y:auto; border-top:1px solid var(--line); padding-top:10px; margin-top:16px; }
  .log div{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted); margin-bottom:6px; line-height:1.6; }

  .verdict{ text-align:center; padding:6px 0 4px; }
  .verdict .side{ font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.12em; color:var(--muted); margin-bottom:8px; }
  .verdict h2{ font-size:26px; margin-bottom:6px; color:var(--village); }

  .hidden{ display:none !important; }
  .footer-note{ text-align:center; margin-top:16px; color:var(--muted); font-size:11.5px; font-family:'JetBrains Mono',monospace; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="stage">
  <div class="file"><div class="file-body" id="app"></div></div>
  <div class="footer-note">ONLINE PSYCH GAME — ハッタリ・ナンバー</div>
</div>

<script>
/* ---------------- Firebase ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDWxhILNkj0RrOV248Bh2zoFZfNq2G-3N0",
  authDomain: "zoukin-kart.firebaseapp.com",
  projectId: "zoukin-kart",
  storageBucket: "zoukin-kart.firebasestorage.app",
  messagingSenderId: "627298939041",
  appId: "1:627298939041:web:3dafaed8c6d267f1d780e0",
  measurementId: "G-DDW4R9EXW5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ---------------- Local state ---------------- */
let S = {
  screen: 'home',        // home | lobby | playing | finished
  authTab: 'create',
  roomCode: null,
  playerId: null,
  playerName: '',
  room: null,             // live snapshot data
  unsub: null,
  errorMsg: '',
  bidInput: '',
};

const app = document.getElementById('app');
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

function uid(){
  return 'p' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
}
function genCode(){
  let c=''; for(let i=0;i<4;i++) c += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return c;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function render(){
  if(S.screen==='home') renderHome();
  else if(S.screen==='lobby') renderLobby();
  else if(S.screen==='playing') renderPlaying();
  else if(S.screen==='finished') renderFinished();
}

/* ---------------- HOME ---------------- */
function renderHome(){
  app.innerHTML = `
    <p class="kicker">FILE No.00 — 起動</p>
    <h1>ハッタリ・ナンバー</h1>
    <p>自分だけの秘密の数字を持ち寄り、全員の合計を「これ以上ある」とハッタリで宣言していく心理戦。宣言を信じるか、「ウソだ！」と見破るか——賢く読み、大胆に騙す。</p>
    <div class="divider"></div>
    <div class="tabs">
      <div class="tab ${S.authTab==='create'?'active':''}" id="tabCreate">部屋を作る</div>
      <div class="tab ${S.authTab==='join'?'active':''}" id="tabJoin">部屋に入る</div>
    </div>
    <div class="field">
      <label>あなたの名前</label>
      <input type="text" id="nameInput" maxlength="10" placeholder="なまえ" value="${escapeHtml(S.playerName)}">
    </div>
    ${S.authTab==='join' ? `
    <div class="field">
      <label>部屋コード（4桁）</label>
      <input type="text" id="codeInput" class="mono-input" maxlength="4" placeholder="XXXX">
    </div>` : ''}
    ${S.errorMsg ? `<div class="errmsg">${escapeHtml(S.errorMsg)}</div>` : ''}
    <button class="btn" id="goBtn">${S.authTab==='create' ? '部屋を作成する →' : '入室する →'}</button>
  `;
  document.getElementById('tabCreate').onclick = ()=>{ S.authTab='create'; S.errorMsg=''; render(); };
  document.getElementById('tabJoin').onclick = ()=>{ S.authTab='join'; S.errorMsg=''; render(); };
  document.getElementById('nameInput').oninput = e=> S.playerName = e.target.value;
  const codeEl = document.getElementById('codeInput');
  if(codeEl) codeEl.oninput = e=> e.target.value = e.target.value.toUpperCase();
  document.getElementById('goBtn').onclick = ()=>{
    S.errorMsg='';
    const name = (S.playerName||'').trim();
    if(!name){ S.errorMsg='名前を入力してください'; render(); return; }
    if(S.authTab==='create') createRoom(name);
    else{
      const code = (document.getElementById('codeInput').value||'').trim().toUpperCase();
      if(code.length!==4){ S.errorMsg='4桁のコードを入力してください'; render(); return; }
      joinRoom(code, name);
    }
  };
}

async function createRoom(name){
  const code = genCode();
  const pid = uid();
  const data = {
    createdAt: Date.now(),
    status: 'lobby',
    order: [pid],
    turnIndex: 0,
    currentBid: null,
    round: 0,
    winner: null,
    log: [`部屋 ${code} が作成されました`],
    players: { [pid]: { name, lives: 3, number: 0, eliminated: false } }
  };
  try{
    await db.collection('rooms').doc(code).set(data);
    S.roomCode = code; S.playerId = pid; S.playerName = name;
    subscribeRoom(code);
  }catch(e){
    S.errorMsg = '作成に失敗しました: ' + e.message;
    render();
  }
}

async function joinRoom(code, name){
  const ref = db.collection('rooms').doc(code);
  try{
    const snap = await ref.get();
    if(!snap.exists){ S.errorMsg='その部屋は見つかりません'; render(); return; }
    const data = snap.data();
    if(data.status !== 'lobby'){ S.errorMsg='この部屋はすでに開始しています'; render(); return; }
    const pid = uid();
    await ref.update({
      [`players.${pid}`]: { name, lives:3, number:0, eliminated:false },
      order: firebase.firestore.FieldValue.arrayUnion(pid),
      log: firebase.firestore.FieldValue.arrayUnion(`${name} が入室しました`)
    });
    S.roomCode = code; S.playerId = pid; S.playerName = name;
    subscribeRoom(code);
  }catch(e){
    S.errorMsg = '入室に失敗しました: ' + e.message;
    render();
  }
}

function subscribeRoom(code){
  if(S.unsub) S.unsub();
  S.unsub = db.collection('rooms').doc(code).onSnapshot(snap=>{
    if(!snap.exists){ return; }
    S.room = snap.data();
    if(S.room.status==='lobby') S.screen='lobby';
    else if(S.room.status==='playing') S.screen='playing';
    else if(S.room.status==='finished') S.screen='finished';
    render();
  });
}

/* ---------------- LOBBY ---------------- */
function renderLobby(){
  const r = S.room;
  const players = Object.entries(r.players || {});
  app.innerHTML = `
    <p class="kicker">FILE No.01 — 待機室</p>
    <div class="roomcode">
      <div class="tag">ROOM CODE</div>
      <div class="code">${S.roomCode}</div>
      <div class="tag" style="margin-top:6px;">このコードを他の人に伝えてください</div>
    </div>
    <div class="divider"></div>
    <p class="muted">参加者（${players.length}人）</p>
    <div class="plist">
      ${players.map(([id,p])=>`<div class="prow">${escapeHtml(p.name)}${id===S.playerId?' (あなた)':''}</div>`).join('')}
    </div>
    <button class="btn" id="startBtn" ${players.length<2?'disabled':''}>ゲーム開始 →</button>
    ${players.length<2 ? '<p class="muted" style="text-align:center;margin-top:10px;">2人以上で開始できます</p>' : ''}
  `;
  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.onclick = startGame;
}

async function startGame(){
  const ref = db.collection('rooms').doc(S.roomCode);
  try{
    await db.runTransaction(async (t)=>{
      const snap = await t.get(ref);
      const data = snap.data();
      const order = data.order.filter(id => data.players[id]);
      const update = {
        status: 'playing',
        order,
        turnIndex: 0,
        currentBid: null,
        round: 1,
        winner: null,
        log: firebase.firestore.FieldValue.arrayUnion('--- ラウンド1、開始 ---')
      };
      order.forEach(id=>{
        update[`players.${id}.number`] = 1 + Math.floor(Math.random()*9);
        update[`players.${id}.lives`] = 3;
        update[`players.${id}.eliminated`] = false;
      });
      t.update(ref, update);
    });
  }catch(e){ console.error(e); }
}

/* ---------------- helpers for gameplay ---------------- */
function aliveOrder(r){
  return r.order.filter(id => r.players[id] && !r.players[id].eliminated);
}
function nextAliveIndexInOrder(order, players, fromIdx){
  const n = order.length;
  for(let step=1; step<=n; step++){
    const idx = (fromIdx + step) % n;
    if(players[order[idx]] && !players[order[idx]].eliminated) return idx;
  }
  return fromIdx;
}

/* ---------------- PLAYING ---------------- */
function renderPlaying(){
  const r = S.room;
  const order = r.order;
  const me = r.players[S.playerId];
  const currentTurnId = order[r.turnIndex];
  const isMyTurn = currentTurnId === S.playerId;
  const aliveCount = order.filter(id=>r.players[id] && !r.players[id].eliminated).length;
  const maxBid = 9 * aliveCount;
  const minBid = r.currentBid ? r.currentBid.value + 1 : 1;

  const rows = order.map(id=>{
    const p = r.players[id];
    if(!p) return '';
    const isTurn = id===currentTurnId && !p.eliminated;
    return `<div class="prow ${isTurn?'turn':''} ${p.eliminated?'dead':''}">
      <span>${escapeHtml(p.name)}${id===S.playerId?' (あなた)':''}${isTurn?' — 番':''}</span>
      <span class="hearts">${'♥'.repeat(Math.max(p.lives,0))}${p.eliminated?' OUT':''}</span>
    </div>`;
  }).join('');

  const bidHtml = r.currentBid ? `
    <div class="bidbox">
      <div class="who">現在の宣言 — ${escapeHtml(r.currentBid.byName)}</div>
      <div class="val">合計 ${r.currentBid.value} 以上</div>
    </div>` : `
    <div class="bidbox">
      <div class="who">まだ宣言はありません</div>
      <div class="val mono">最初の宣言を待っています</div>
    </div>`;

  const logHtml = (r.log||[]).slice(-8).map(l=>`<div>${escapeHtml(l)}</div>`).join('');

  app.innerHTML = `
    <p class="kicker">ROUND ${r.round}</p>
    <h2>ハッタリ・ナンバー</h2>
    <div class="mycard">
      <div class="label">あなたの数字（他人には見せないで）</div>
      <div class="num">${me ? me.number : '-'}</div>
    </div>
    ${bidHtml}
    <div class="plist">${rows}</div>
    <div id="actionArea"></div>
    <div class="log">${logHtml}</div>
  `;

  const actionArea = document.getElementById('actionArea');
  if(!me || me.eliminated){
    actionArea.innerHTML = `<p class="muted" style="text-align:center;">あなたは脱落しています。観戦を続けられます。</p>`;
    return;
  }
  if(!isMyTurn){
    actionArea.innerHTML = `<p class="muted" style="text-align:center;">${escapeHtml(r.players[currentTurnId].name)} さんの番です。お待ちください。</p>`;
    return;
  }
  actionArea.innerHTML = `
    <div class="field">
      <label>宣言する合計値（${minBid} 〜 ${maxBid}）</label>
      <input type="number" id="bidNum" class="mono-input" min="${minBid}" max="${maxBid}" placeholder="${minBid}">
    </div>
    <button class="btn" id="bidBtn">この数字を宣言する</button>
    <div class="btn-row">
      <button class="btn danger" id="challengeBtn" ${r.currentBid ? '' : 'disabled'}>「ウソだ！」と見破る</button>
    </div>
  `;
  document.getElementById('bidBtn').onclick = ()=> placeBid(minBid, maxBid);
  document.getElementById('challengeBtn').onclick = challenge;
}

async function placeBid(minBid, maxBid){
  const val = parseInt(document.getElementById('bidNum').value, 10);
  if(!val || val < minBid || val > maxBid){
    alert(`宣言は ${minBid} から ${maxBid} の間で入力してください`);
    return;
  }
  const ref = db.collection('rooms').doc(S.roomCode);
  try{
    await db.runTransaction(async (t)=>{
      const snap = await t.get(ref);
      const data = snap.data();
      const order = data.order;
      if(order[data.turnIndex] !== S.playerId) return;
      const nextIdx = nextAliveIndexInOrder(order, data.players, data.turnIndex);
      const myName = data.players[S.playerId].name;
      t.update(ref, {
        currentBid: { value: val, by: S.playerId, byName: myName },
        turnIndex: nextIdx,
        log: firebase.firestore.FieldValue.arrayUnion(`${myName}: 「合計 ${val} 以上」`)
      });
    });
  }catch(e){ console.error(e); }
}

async function challenge(){
  const ref = db.collection('rooms').doc(S.roomCode);
  try{
    await db.runTransaction(async (t)=>{
      const snap = await t.get(ref);
      const data = snap.data();
      const order = data.order;
      if(order[data.turnIndex] !== S.playerId) return;
      if(!data.currentBid) return;

      const aliveIds = order.filter(id => data.players[id] && !data.players[id].eliminated);
      const total = aliveIds.reduce((sum,id)=> sum + (data.players[id].number||0), 0);
      const bid = data.currentBid;
      const challengerId = S.playerId;
      const bidderId = bid.by;
      const bidderTrue = total >= bid.value;
      const loserId = bidderTrue ? challengerId : bidderId;
      const loserName = data.players[loserId].name;

      const update = {};
      const newLives = Math.max((data.players[loserId].lives||0) - 1, 0);
      update[`players.${loserId}.lives`] = newLives;
      const eliminated = newLives <= 0;
      update[`players.${loserId}.eliminated`] = eliminated;

      const logMsg = `${data.players[challengerId].name} が「ウソだ！」→ 実際の合計は${total}。${bidderTrue ? '宣言は本当だった' : '宣言はハッタリだった'}。${loserName} がライフを失った（残り${newLives}）`;

      const stillAlive = order.filter(id=>{
        if(id===loserId) return !eliminated;
        return data.players[id] && !data.players[id].eliminated;
      });

      if(stillAlive.length <= 1){
        update.status = 'finished';
        update.winner = stillAlive[0] || null;
        update.log = firebase.firestore.FieldValue.arrayUnion(logMsg, '--- ゲーム終了 ---');
        t.update(ref, update);
        return;
      }

      order.forEach(id=>{
        if(data.players[id] && !(id===loserId && eliminated)){
          update[`players.${id}.number`] = 1 + Math.floor(Math.random()*9);
        }
      });
      update.currentBid = null;
      update.round = (data.round||1) + 1;

      const loserIdx = order.indexOf(loserId);
      let nextIdx;
      if(!eliminated){
        nextIdx = loserIdx;
      } else {
        nextIdx = nextAliveIndexInOrder(order, {...data.players, [loserId]:{...data.players[loserId], eliminated:true}}, loserIdx);
      }
      update.turnIndex = nextIdx;
      update.log = firebase.firestore.FieldValue.arrayUnion(logMsg, `--- ラウンド${(data.round||1)+1}、開始 ---`);

      t.update(ref, update);
    });
  }catch(e){ console.error(e); }
}

/* ---------------- FINISHED ---------------- */
function renderFinished(){
  const r = S.room;
  const winner = r.winner ? r.players[r.winner] : null;
  app.innerHTML = `
    <p class="kicker">FILE No.02 — 決着</p>
    <div class="verdict">
      <div class="side">GAME OVER</div>
      <h2>${winner ? escapeHtml(winner.name) + ' の勝利！' : '決着つかず'}</h2>
      <p class="muted">最後まで生き残り、ハッタリと読み合いを制しました。</p>
    </div>
    <div class="log">${(r.log||[]).slice(-10).map(l=>`<div>${escapeHtml(l)}</div>`).join('')}</div>
    <button class="btn" id="lobbyBtn" style="margin-top:16px;">ロビーに戻ってもう一度</button>
  `;
  document.getElementById('lobbyBtn').onclick = backToLobby;
}

async function backToLobby(){
  const ref = db.collection('rooms').doc(S.roomCode);
  try{
    await db.runTransaction(async (t)=>{
      const snap = await t.get(ref);
      const data = snap.data();
      const update = {
        status: 'lobby',
        currentBid: null,
        turnIndex: 0,
        round: 0,
        winner: null,
        log: firebase.firestore.FieldValue.arrayUnion('--- ロビーに戻りました ---')
      };
      Object.keys(data.players).forEach(id=>{
        update[`players.${id}.lives`] = 3;
        update[`players.${id}.eliminated`] = false;
        update[`players.${id}.number`] = 0;
      });
      t.update(ref, update);
    });
  }catch(e){ console.error(e); }
}

render();
</script>
</body>
</html>
