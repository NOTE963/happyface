<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>INK FIELD BATTLE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b0d13; font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; }
  #gameCanvas { display:block; position:absolute; top:0; left:0; }

  /* --- Overlay: Lobby --- */
  #lobby {
    position:absolute; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 20%, #1a1f2e 0%, #0b0d13 70%);
    color:#fff; gap:18px; padding:24px;
  }
  #lobby h1 {
    font-size:28px; letter-spacing:2px; font-weight:900;
    background: linear-gradient(90deg,#F2622E,#1FB6A6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
  }
  #lobby input {
    width:220px; padding:12px 14px; border-radius:10px; border:2px solid #333c50;
    background:#161b26; color:#fff; font-size:16px; text-align:center;
  }
  .teamRow { display:flex; gap:12px; }
  .teamBtn {
    width:100px; padding:14px 0; border-radius:12px; border:3px solid transparent;
    font-weight:800; font-size:15px; color:#fff; cursor:pointer;
  }
  .teamBtn.a { background:#F2622E; }
  .teamBtn.b { background:#1FB6A6; }
  .teamBtn.selected { border-color:#fff; transform:scale(1.06); }
  #joinBtn {
    padding:14px 40px; border-radius:30px; border:none; font-size:17px; font-weight:900;
    background:#fff; color:#111; letter-spacing:1px; box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  #joinBtn:active { transform:scale(0.96); }
  #lobbyStatus { font-size:12px; color:#8a93a8; min-height:16px; }

  /* --- HUD --- */
  #hud {
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; padding:10px 12px; gap:10px;
    pointer-events:none;
  }
  #timer {
    background:rgba(10,12,18,.75); color:#fff; font-weight:900; font-size:16px;
    padding:6px 14px; border-radius:20px; min-width:56px; text-align:center;
    border:1px solid rgba(255,255,255,.15);
  }
  #scoreBar {
    flex:1; height:16px; border-radius:8px; overflow:hidden; display:flex;
    background:#20242f; border:1px solid rgba(255,255,255,.15);
  }
  #scoreA { background:#F2622E; height:100%; width:50%; transition: width .25s; }
  #scoreB { background:#1FB6A6; height:100%; width:50%; transition: width .25s; }
  #pct { display:flex; justify-content:space-between; font-size:11px; color:#cfd4e0; padding:0 4px; }

  /* --- Result --- */
  #result {
    position:absolute; inset:0; z-index:60; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:10px;
    background:rgba(5,6,10,.9); color:#fff; text-align:center;
  }
  #result h2 { font-size:30px; font-weight:900; }
  #result p { font-size:15px; color:#b9c0d1; }
  #result button {
    margin-top:14px; padding:12px 30px; border-radius:24px; border:none;
    background:#fff; color:#111; font-weight:900; font-size:15px;
  }

  /* --- Controls --- */
  #controls {
    position:absolute; inset:0; z-index:15; pointer-events:none;
  }
  #joystickZone {
    position:absolute; left:0; bottom:0; width:45%; height:45%;
    pointer-events:auto;
  }
  #joystickBase {
    position:absolute; width:110px; height:110px; border-radius:50%;
    background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.25);
    display:none;
  }
  #joystickStick {
    position:absolute; width:50px; height:50px; border-radius:50%;
    background:rgba(255,255,255,.5); border:2px solid rgba(255,255,255,.7);
    display:none;
  }
  #shootBtn {
    position:absolute; right:26px; bottom:36px; width:92px; height:92px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffdcae, #F2622E 70%);
    border:3px solid rgba(255,255,255,.6); pointer-events:auto;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; color:#4a1c00; font-size:13px; letter-spacing:1px;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
  }
  #shootBtn.active { transform:scale(0.92); filter:brightness(1.15); }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud" style="display:none;">
  <div id="timer">90</div>
  <div>
    <div id="scoreBar"><div id="scoreA"></div><div id="scoreB"></div></div>
    <div id="pct"><span id="pctA">50%</span><span id="pctB">50%</span></div>
  </div>
</div>

<div id="controls" style="display:none;">
  <div id="joystickZone">
    <div id="joystickBase"></div>
    <div id="joystickStick"></div>
  </div>
  <div id="shootBtn">INK</div>
</div>

<div id="lobby">
  <h1>INK FIELD BATTLE</h1>
  <input id="roomInput" placeholder="ルームID (例: room1)" value="room1">
  <div class="teamRow">
    <div class="teamBtn a" id="teamA">オレンジ</div>
    <div class="teamBtn b" id="teamB">ティール</div>
  </div>
  <button id="joinBtn">バトル開始</button>
  <div id="lobbyStatus"></div>
</div>

<div id="result">
  <h2 id="resultTitle">RESULT</h2>
  <p id="resultDetail"></p>
  <button id="againBtn">もう一度</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, set, update, onValue, onDisconnect, remove, get, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWxhILNkj0RrOV248Bh2zoFZfNq2G-3N0",
  authDomain: "zoukin-kart.firebaseapp.com",
  databaseURL: "https://zoukin-kart-default-rtdb.firebaseio.com",
  projectId: "zoukin-kart",
  storageBucket: "zoukin-kart.firebasestorage.app",
  messagingSenderId: "627298939041",
  appId: "1:627298939041:web:3dafaed8c6d267f1d780e0",
  measurementId: "G-DDW4R9EXW5"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ============ CONFIG ============ */
const COLS = 14, ROWS = 20;              // フィールドの格子サイズ(軽量に保つ)
const BATTLE_MS = 90000;                 // 90秒バトル
const TEAM_COLOR = { a:'#F2622E', b:'#1FB6A6', n:'#3a4055' };
const TEAM_COLOR_DARK = { a:'#c94d1f', b:'#159d90', n:'#2c3040' };
const uid = 'p' + Math.random().toString(36).slice(2,9);

let myTeam = null, roomId = null;
let cellW=0, cellH=0, originX=0, originY=0;

/* grid: 0=neutral,1=team a,2=team b */
let grid = new Array(COLS*ROWS).fill(0);
let pendingTileUpdates = {};

let players = {}; // uid -> {x,y,angle,team,name}
let me = { x: COLS/2, y: ROWS/2, angle:0, team:null };

let battleEnd = 0;
let running = false;

/* ============ CANVAS SETUP ============ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resize(){
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth+'px';
  canvas.style.height = window.innerHeight+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

  const availW = window.innerWidth * 0.92;
  const availH = window.innerHeight * 0.86;
  cellW = Math.min(availW/COLS, availH/ROWS);
  cellH = cellW;
  originX = (window.innerWidth - cellW*COLS)/2;
  originY = (window.innerHeight - cellH*ROWS)/2 + 14;
}
window.addEventListener('resize', resize);
resize();

/* per-cell fixed "facet" shading so triangles look like low-poly terrain */
const facetSeed = new Array(COLS*ROWS).fill(0).map(()=> (Math.random()*0.5)); // 0..0.5 darkness variance

function idx(cx,cy){ return cy*COLS+cx; }

/* ============ DRAW ============ */
function shade(hex, amt){
  // amt: -1..1 darken/lighten
  const c = hex.replace('#','');
  let r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  const f = amt<0 ? (v)=>v*(1+amt) : (v)=>v+(255-v)*amt;
  r=Math.max(0,Math.min(255,f(r))); g=Math.max(0,Math.min(255,f(g))); b=Math.max(0,Math.min(255,f(b)));
  return `rgb(${r|0},${g|0},${b|0})`;
}

function drawField(){
  ctx.fillStyle = '#0b0d13';
  ctx.fillRect(0,0,window.innerWidth, window.innerHeight);

  for(let cy=0; cy<ROWS; cy++){
    for(let cx=0; cx<COLS; cx++){
      const i = idx(cx,cy);
      const team = grid[i]===1?'a':grid[i]===2?'b':'n';
      const baseColor = TEAM_COLOR[team];
      const x0 = originX+cx*cellW, y0 = originY+cy*cellH;
      const x1 = x0+cellW, y1 = y0+cellH;
      const facet = facetSeed[i];

      // triangle 1 (top-left) - lighter facet
      ctx.beginPath();
      ctx.moveTo(x0,y0); ctx.lineTo(x1,y0); ctx.lineTo(x0,y1); ctx.closePath();
      ctx.fillStyle = shade(baseColor, 0.12 - facet*0.3);
      ctx.fill();

      // triangle 2 (bottom-right) - darker facet
      ctx.beginPath();
      ctx.moveTo(x1,y0); ctx.lineTo(x1,y1); ctx.lineTo(x0,y1); ctx.closePath();
      ctx.fillStyle = shade(baseColor, -0.08 - facet*0.3);
      ctx.fill();
    }
  }

  // grid lines (subtle)
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1;
  for(let cx=0; cx<=COLS; cx++){
    ctx.beginPath(); ctx.moveTo(originX+cx*cellW, originY); ctx.lineTo(originX+cx*cellW, originY+ROWS*cellH); ctx.stroke();
  }
  for(let cy=0; cy<=ROWS; cy++){
    ctx.beginPath(); ctx.moveTo(originX, originY+cy*cellH); ctx.lineTo(originX+COLS*cellW, originY+cy*cellH); ctx.stroke();
  }

  // outer border (low-poly bevel look)
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 3;
  ctx.strokeRect(originX, originY, COLS*cellW, ROWS*cellH);
}

function drawPlayer(p, isMe){
  const px = originX + p.x*cellW;
  const py = originY + p.y*cellH;
  const r = cellW*0.62;
  const col = TEAM_COLOR[p.team] || '#fff';
  const dark = TEAM_COLOR_DARK[p.team] || '#888';

  ctx.save();
  ctx.translate(px,py);
  ctx.rotate(p.angle);

  // triangular "player" polygon (arrow / low-poly boat shape)
  ctx.beginPath();
  ctx.moveTo(r,0);
  ctx.lineTo(-r*0.7, r*0.65);
  ctx.lineTo(-r*0.35,0);
  ctx.lineTo(-r*0.7,-r*0.65);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
  ctx.strokeStyle = isMe ? '#fff' : dark;
  ctx.lineWidth = isMe ? 2.5 : 1.5;
  ctx.stroke();

  ctx.restore();
}

function render(){
  drawField();
  for(const id in players){
    if(id!==uid) drawPlayer(players[id], false);
  }
  drawPlayer(me, true);
  requestAnimationFrame(render);
}

/* ============ INK PAINTING ============ */
function paintInk(){
  if(!running) return;
  const team = me.team===  'a' ? 1 : 2;
  const range = 1.7; // マス単位の噴射範囲
  const cx = Math.round(me.x + Math.cos(me.angle)*0.9);
  const cy = Math.round(me.y + Math.sin(me.angle)*0.9);
  for(let dy=-1; dy<=1; dy++){
    for(let dx=-1; dx<=1; dx++){
      const gx = cx+dx, gy = cy+dy;
      if(gx<0||gy<0||gx>=COLS||gy>=ROWS) continue;
      const dist = Math.hypot(gx-me.x, gy-me.y);
      if(dist>range) continue;
      const i = idx(gx,gy);
      if(grid[i]!==team){
        grid[i]=team;
        pendingTileUpdates[i]=team;
      }
    }
  }
  updateScore();
}

function updateScore(){
  let a=0,b=0,total=grid.length;
  for(const v of grid){ if(v===1)a++; else if(v===2)b++; }
  const pa = Math.round(a/total*100), pb = Math.round(b/total*100);
  document.getElementById('scoreA').style.width = pa+'%';
  document.getElementById('scoreB').style.width = pb+'%';
  document.getElementById('pctA').textContent = 'A '+pa+'%';
  document.getElementById('pctB').textContent = 'B '+pb+'%';
  return {pa,pb};
}

/* flush tile updates to firebase periodically (throttled = 軽量) */
setInterval(()=>{
  if(!running) return;
  const keys = Object.keys(pendingTileUpdates);
  if(keys.length===0) return;
  const payload = {};
  for(const k of keys) payload[k]=pendingTileUpdates[k];
  pendingTileUpdates = {};
  update(ref(db, `rooms/${roomId}/tiles`), payload).catch(()=>{});
}, 150);

/* push my player state periodically */
setInterval(()=>{
  if(!running) return;
  set(ref(db, `rooms/${roomId}/players/${uid}`), {
    x: me.x, y: me.y, angle: me.angle, team: me.team, ts: Date.now()
  }).catch(()=>{});
}, 100);

/* ============ INPUT: virtual joystick ============ */
const joyZone = document.getElementById('joystickZone');
const joyBase = document.getElementById('joystickBase');
const joyStick = document.getElementById('joystickStick');
let joyActive=false, joyCenter={x:0,y:0}, joyVec={x:0,y:0};

function joyStart(x,y){
  joyActive=true;
  joyCenter={x,y};
  joyBase.style.left=(x-55)+'px'; joyBase.style.top=(y-55)+'px'; joyBase.style.display='block';
  joyStick.style.left=(x-25)+'px'; joyStick.style.top=(y-25)+'px'; joyStick.style.display='block';
}
function joyMove(x,y){
  if(!joyActive) return;
  let dx=x-joyCenter.x, dy=y-joyCenter.y;
  const dist=Math.hypot(dx,dy), max=55;
  if(dist>max){ dx=dx/dist*max; dy=dy/dist*max; }
  joyStick.style.left=(joyCenter.x+dx-25)+'px'; joyStick.style.top=(joyCenter.y+dy-25)+'px';
  joyVec = { x: dx/max, y: dy/max };
}
function joyEnd(){
  joyActive=false; joyVec={x:0,y:0};
  joyBase.style.display='none'; joyStick.style.display='none';
}
joyZone.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; joyStart(t.clientX,t.clientY); }, {passive:true});
joyZone.addEventListener('touchmove', e=>{ const t=e.changedTouches[0]; joyMove(t.clientX,t.clientY); }, {passive:true});
joyZone.addEventListener('touchend', joyEnd);
joyZone.addEventListener('mousedown', e=> joyStart(e.clientX,e.clientY));
window.addEventListener('mousemove', e=> joyMove(e.clientX,e.clientY));
window.addEventListener('mouseup', joyEnd);

/* shoot button */
const shootBtn = document.getElementById('shootBtn');
let shooting=false;
function shootStart(){ shooting=true; shootBtn.classList.add('active'); }
function shootStop(){ shooting=false; shootBtn.classList.remove('active'); }
shootBtn.addEventListener('touchstart', e=>{ e.preventDefault(); shootStart(); }, {passive:false});
shootBtn.addEventListener('touchend', shootStop);
shootBtn.addEventListener('mousedown', shootStart);
window.addEventListener('mouseup', shootStop);

/* ============ GAME LOOP ============ */
const SPEED = 4.2; // マス/秒
let lastT = performance.now();
function tick(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
  if(running){
    if(joyVec.x!==0 || joyVec.y!==0){
      me.x += joyVec.x*SPEED*dt;
      me.y += joyVec.y*SPEED*dt;
      me.x = Math.max(0.3, Math.min(COLS-0.3, me.x));
      me.y = Math.max(0.3, Math.min(ROWS-0.3, me.y));
      me.angle = Math.atan2(joyVec.y, joyVec.x);
    }
    if(shooting) paintInk();

    const remain = battleEnd - Date.now();
    document.getElementById('timer').textContent = Math.max(0,Math.ceil(remain/1000));
    if(remain<=0) endBattle();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
render();

/* ============ NETWORK: join / listeners ============ */
function listenTiles(){
  onValue(ref(db, `rooms/${roomId}/tiles`), snap=>{
    const val = snap.val() || {};
    for(const k in val){ grid[k]=val[k]; }
    updateScore();
  });
}
function listenPlayers(){
  onValue(ref(db, `rooms/${roomId}/players`), snap=>{
    players = snap.val() || {};
  });
}
async function ensureBattleEnd(){
  const endRef = ref(db, `rooms/${roomId}/battleEnd`);
  const result = await runTransaction(endRef, cur=>{
    if(cur && cur > Date.now()-5000) return cur; // 既に進行中ならそのまま
    return Date.now()+BATTLE_MS;
  });
  battleEnd = result.snapshot.val();
  onValue(endRef, snap=>{ if(snap.val()) battleEnd = snap.val(); });
}

document.getElementById('teamA').onclick = ()=>{
  myTeam='a';
  document.getElementById('teamA').classList.add('selected');
  document.getElementById('teamB').classList.remove('selected');
};
document.getElementById('teamB').onclick = ()=>{
  myTeam='b';
  document.getElementById('teamB').classList.add('selected');
  document.getElementById('teamA').classList.remove('selected');
};

document.getElementById('joinBtn').onclick = async ()=>{
  const statusEl = document.getElementById('lobbyStatus');
  roomId = (document.getElementById('roomInput').value || 'room1').trim().replace(/[.#$\[\]/]/g,'_');
  if(!myTeam){ statusEl.textContent='チームを選んでください'; return; }
  if(!roomId){ statusEl.textContent='ルームIDを入力してください'; return; }
  statusEl.textContent='接続中...';
  me.team = myTeam;
  me.x = myTeam==='a' ? 2 : COLS-3;
  me.y = ROWS/2;

  try{
    // 既存タイルを取得(なければ全マス中立で初期化)
    const tilesSnap = await get(ref(db, `rooms/${roomId}/tiles`));
    if(!tilesSnap.exists()){
      grid = new Array(COLS*ROWS).fill(0);
    } else {
      const val = tilesSnap.val();
      for(const k in val) grid[k]=val[k];
    }
    listenTiles();
    listenPlayers();
    await ensureBattleEnd();

    const myRef = ref(db, `rooms/${roomId}/players/${uid}`);
    await set(myRef, {x:me.x,y:me.y,angle:0,team:me.team,ts:Date.now()});
    onDisconnect(myRef).remove();

    document.getElementById('lobby').style.display='none';
    document.getElementById('hud').style.display='flex';
    document.getElementById('controls').style.display='block';
    running = true;
  }catch(err){
    statusEl.textContent='接続エラー: '+err.message;
  }
};

function endBattle(){
  running=false;
  document.getElementById('controls').style.display='none';
  document.getElementById('hud').style.display='none';
  const {pa,pb} = updateScore();
  const res = document.getElementById('result');
  const title = document.getElementById('resultTitle');
  const detail = document.getElementById('resultDetail');
  if(pa===pb){ title.textContent='DRAW'; title.style.color='#fff'; }
  else if(pa>pb){ title.textContent='オレンジ WIN!'; title.style.color=TEAM_COLOR.a; }
  else { title.textContent='ティール WIN!'; title.style.color=TEAM_COLOR.b; }
  detail.textContent = `オレンジ ${pa}% / ティール ${pb}%`;
  res.style.display='flex';
}

document.getElementById('againBtn').onclick = ()=>{
  location.reload();
};
</script>
</body>
</html>
