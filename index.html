<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LATE SHIFT — 深夜警備員</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090a;
  --panel:#101512;
  --panel-edge:#1d2620;
  --phosphor:#39d353;
  --phosphor-dim:#1f7a34;
  --amber:#e8a33d;
  --danger:#c9425a;
  --static:#4a524a;
  --text:#c8ead0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; width:100%; height:100%;
  background:var(--bg); color:var(--text);
  font-family:'Share Tech Mono', monospace;
  overflow:hidden;
  overscroll-behavior:none;
}
#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen{
  flex:1; display:none; flex-direction:column; min-height:0;
  animation:fadeIn .4s ease;
}
.screen.active{display:flex;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- scanline / vignette overlay ---------- */
#scan{
  position:fixed; inset:0; pointer-events:none; z-index:50; mix-blend-mode:overlay;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 3px);
}
#vignette{
  position:fixed; inset:0; pointer-events:none; z-index:49;
  box-shadow: inset 0 0 18vw 4vw rgba(0,0,0,0.75);
}

/* ---------- title screen ---------- */
#screen-title{ align-items:center; justify-content:center; text-align:center; padding:24px; gap:18px; }
.logo{
  font-size:clamp(34px,10vw,54px); letter-spacing:6px; color:var(--phosphor);
  text-shadow:0 0 6px var(--phosphor-dim), 0 0 18px rgba(57,211,83,0.35);
  line-height:1.1;
}
.logo small{display:block; font-size:0.32em; letter-spacing:3px; color:var(--static); margin-top:8px;}
.flavor{ max-width:320px; font-size:13px; line-height:1.7; color:var(--static); }
.menu{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:300px; margin-top:10px; }
.btn{
  appearance:none; border:1px solid var(--phosphor-dim); background:var(--panel);
  color:var(--phosphor); font-family:inherit; font-size:16px; letter-spacing:2px;
  padding:14px 16px; border-radius:2px; cursor:pointer; min-height:48px;
}
.btn:active{ background:var(--phosphor-dim); color:#04140a; }
.btn.amber{ border-color:var(--amber); color:var(--amber); }
.btn.amber:active{ background:var(--amber); color:#241400; }
.btn.danger{ border-color:var(--danger); color:var(--danger); }
.btn.danger:active{ background:var(--danger); color:#1a0509; }
.btn:disabled{ opacity:0.35; }
input.code-input{
  appearance:none; width:100%; background:var(--panel); border:1px solid var(--panel-edge);
  color:var(--phosphor); font-family:inherit; font-size:22px; letter-spacing:8px; text-align:center;
  text-transform:uppercase; padding:14px; border-radius:2px; min-height:48px;
}
.hint{ font-size:11px; color:var(--static); letter-spacing:1px; }
.error-text{ font-size:12px; color:var(--danger); min-height:16px; }

/* ---------- lobby ---------- */
#screen-lobby{ align-items:center; justify-content:center; text-align:center; padding:24px; gap:16px; }
.room-code{
  font-size:44px; letter-spacing:14px; color:var(--amber); border:1px dashed var(--amber);
  padding:14px 10px; border-radius:2px;
}
.slot-row{ display:flex; gap:14px; width:100%; max-width:320px; }
.slot{
  flex:1; border:1px solid var(--panel-edge); background:var(--panel); border-radius:2px;
  padding:14px 8px; font-size:12px; letter-spacing:1px;
}
.slot .dot{
  width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px;
  background:var(--static);
}
.slot.online .dot{ background:var(--phosphor); box-shadow:0 0 6px var(--phosphor); }
.slot .role{ display:block; margin-top:6px; color:var(--text); font-size:14px; }

/* ---------- game screen ---------- */
#screen-game{ flex-direction:column; }
#hud{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:8px 10px; background:var(--panel); border-bottom:1px solid var(--panel-edge);
  font-size:12px; letter-spacing:1px; flex-shrink:0;
}
#hud .stat{ display:flex; flex-direction:column; align-items:center; min-width:44px; }
#hud .stat .v{ font-size:15px; color:var(--phosphor); }
#hud .stat.power .v{ color:var(--amber); }
#hud .stat.power.low .v{ color:var(--danger); animation:blink 0.6s infinite; }
@keyframes blink{50%{opacity:0.2}}
#hud .label{ color:var(--static); font-size:9px; letter-spacing:1px; }

#viewport{
  flex:1; position:relative; min-height:0; background:#000;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
#office-view, #cam-view{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
}
#cam-view{ display:none; flex-direction:column; }
.cam-header{
  position:absolute; top:8px; left:8px; right:8px; display:flex; justify-content:space-between;
  font-size:11px; color:var(--phosphor); letter-spacing:2px; z-index:5;
}
.cam-header .rec{ color:var(--danger); }
.cam-tabs{
  position:absolute; bottom:8px; left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:5;
}
.cam-tab{
  border:1px solid var(--panel-edge); background:rgba(16,21,18,0.85); color:var(--static);
  font-family:inherit; font-size:11px; padding:8px 10px; border-radius:2px; min-width:44px;
}
.cam-tab.active{ color:var(--phosphor); border-color:var(--phosphor-dim); }
.cam-tab.alert{ color:var(--danger); border-color:var(--danger); animation:blink 0.5s infinite; }

svg{ width:100%; height:100%; max-height:100%; }

.door-flash{
  position:absolute; inset:0; background:var(--danger); opacity:0; pointer-events:none; z-index:20;
}
.door-flash.on{ animation:doorFlash 0.9s infinite; }
@keyframes doorFlash{0%,100%{opacity:0}50%{opacity:0.35}}

#static-canvas{ position:absolute; inset:0; pointer-events:none; opacity:0; z-index:6; }
#static-canvas.on{ opacity:0.18; }

#partner-banner{
  position:absolute; top:34px; left:8px; right:8px; font-size:11px; color:var(--static);
  z-index:5; letter-spacing:1px; text-align:center;
}

#controls{
  flex-shrink:0; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;
  padding:10px; background:var(--panel); border-top:1px solid var(--panel-edge);
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
}
.ctrl-btn{
  appearance:none; border:1px solid var(--panel-edge); background:#0c100d; color:var(--text);
  font-family:inherit; font-size:12px; letter-spacing:1px; padding:14px 4px; border-radius:2px;
  min-height:54px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
}
.ctrl-btn .icon{ font-size:18px; }
.ctrl-btn.active{ background:var(--phosphor-dim); color:#04140a; border-color:var(--phosphor); }
.ctrl-btn.danger-active{ background:var(--danger); color:#1a0509; border-color:var(--danger); }

#log{
  position:absolute; left:8px; bottom:8px; font-size:10px; color:var(--phosphor-dim);
  max-width:70%; z-index:5; line-height:1.5; pointer-events:none;
}

/* ---------- end screen ---------- */
#screen-end{ align-items:center; justify-content:center; text-align:center; padding:24px; gap:14px; }
#end-title{ font-size:30px; letter-spacing:4px; }
#end-title.win{ color:var(--phosphor); text-shadow:0 0 10px var(--phosphor-dim); }
#end-title.lose{ color:var(--danger); text-shadow:0 0 10px var(--danger); }
#end-sub{ font-size:13px; color:var(--static); max-width:280px; }

.jumpscare{
  position:fixed; inset:0; background:#000; z-index:100; display:none;
  align-items:center; justify-content:center;
}
.jumpscare.show{ display:flex; animation:jscareFlash 0.15s steps(2) 4; }
@keyframes jscareFlash{ 0%,100%{background:#000} 50%{background:#3a0008} }
.jumpscare svg{ width:70%; max-width:320px; }

.hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- TITLE -->
  <section id="screen-title" class="screen active">
    <div class="logo">LATE SHIFT<small>深夜0時〜朝6時 生存記録</small></div>
    <p class="flavor">閉店後の店内に一人、いや二人。監視カメラで通路を見張り、近づいてきたら扉を閉めろ。電力は有限。朝6時のチャイムまで生き延びろ。</p>
    <div class="menu">
      <input id="name-input" class="code-input" style="font-size:16px;letter-spacing:2px;text-transform:none;" placeholder="ニックネーム" maxlength="10">
      <button class="btn" id="btn-create">部屋を作る</button>
      <input id="join-code" class="code-input" placeholder="コード入力" maxlength="4">
      <button class="btn amber" id="btn-join">友達の部屋に入る</button>
      <p class="error-text" id="title-error"></p>
      <p class="hint">友達に4桁のコードを送って一緒に監視しよう</p>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="screen-lobby" class="screen">
    <p class="hint">合言葉をシェア</p>
    <div class="room-code" id="lobby-code">----</div>
    <div class="slot-row">
      <div class="slot" id="slot-p1"><span class="dot"></span>P1<span class="role" id="slot-p1-name">-</span></div>
      <div class="slot" id="slot-p2"><span class="dot"></span>P2<span class="role" id="slot-p2-name">待機中</span></div>
    </div>
    <button class="btn" id="btn-ready">準備完了</button>
    <p class="hint" id="lobby-status">相手を待っています…</p>
    <button class="btn danger" id="btn-leave-lobby">部屋を出る</button>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <div id="hud">
      <div class="stat"><div class="v" id="hud-time">12:00 AM</div><div class="label">TIME</div></div>
      <div class="stat power" id="hud-power-wrap"><div class="v" id="hud-power">100%</div><div class="label">POWER</div></div>
      <div class="stat"><div class="v" id="hud-partner-status">●</div><div class="label" id="hud-partner-label">P2</div></div>
    </div>
    <div id="viewport">
      <div id="office-view">
        <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice">
          <rect width="400" height="260" fill="#0a0d0a"/>
          <rect x="0" y="200" width="400" height="60" fill="#0d130f"/>
          <rect x="40" y="20" width="90" height="150" fill="#111611" stroke="#1d2620" stroke-width="2" id="door-l-frame"/>
          <rect x="270" y="20" width="90" height="150" fill="#111611" stroke="#1d2620" stroke-width="2" id="door-r-frame"/>
          <rect x="40" y="20" width="90" height="150" fill="var(--danger)" opacity="0" id="door-l-shut"/>
          <rect x="270" y="20" width="90" height="150" fill="var(--danger)" opacity="0" id="door-r-shut"/>
          <rect x="150" y="150" width="100" height="14" fill="#161c17"/>
          <circle cx="200" cy="120" r="30" fill="#0e120f" stroke="#1d2620" stroke-width="1"/>
        </svg>
        <div class="door-flash" id="doorflash-l"></div>
        <div class="door-flash" id="doorflash-r"></div>
      </div>
      <div id="cam-view">
        <div class="cam-header"><span id="cam-name">CAM 1 — HALL</span><span class="rec">● REC</span></div>
        <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" id="cam-svg">
          <rect width="400" height="260" fill="#05070600"/>
          <rect x="0" y="0" width="400" height="260" fill="#060907"/>
          <rect x="0" y="150" width="400" height="110" fill="#0a0e0b"/>
        </svg>
        <canvas id="static-canvas"></canvas>
        <div class="cam-tabs" id="cam-tabs"></div>
      </div>
      <div id="partner-banner"></div>
      <div id="log"></div>
    </div>
    <div id="controls">
      <button class="ctrl-btn" id="btn-door"><span class="icon">🚪</span><span id="door-label">扉を閉める</span></button>
      <button class="ctrl-btn" id="btn-light"><span class="icon">💡</span><span>廊下灯</span></button>
      <button class="ctrl-btn" id="btn-cam"><span class="icon">📷</span><span id="cam-btn-label">カメラ確認</span></button>
    </div>
  </section>

  <!-- END -->
  <section id="screen-end" class="screen">
    <div id="end-title">-</div>
    <p id="end-sub"></p>
    <button class="btn" id="btn-restart">タイトルへ戻る</button>
  </section>

  <div id="scan"></div>
  <div id="vignette"></div>

  <div class="jumpscare" id="jumpscare">
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="90" fill="#0a0a0a"/>
      <circle cx="65" cy="85" r="14" fill="#ff2b3d"/>
      <circle cx="135" cy="85" r="14" fill="#ff2b3d"/>
      <path d="M50 140 Q100 190 150 140 L150 150 Q100 200 50 150 Z" fill="#ff2b3d"/>
    </svg>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDWxhILNkj0RrOV248Bh2zoFZfNq2G-3N0",
  authDomain: "zoukin-kart.firebaseapp.com",
  databaseURL: "https://zoukin-kart-default-rtdb.firebaseio.com",
  projectId: "zoukin-kart",
  storageBucket: "zoukin-kart.firebasestorage.app",
  messagingSenderId: "627298939041",
  appId: "1:627298939041:web:3dafaed8c6d267f1d780e0",
  measurementId: "G-DDW4R9EXW5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============ STATE ============ */
const CLIENT_ID = 'c_' + Math.random().toString(36).slice(2,10);
let ROOM = null;
let MY_SLOT = null; // 'p1' or 'p2'
let roomRef = null;
let roomListener = null;
let hostLoopHandle = null;
let latestState = null;
let currentCam = 0;
const CAMS = [
  {name:'CAM 1 — HALL', danger:0.34},
  {name:'CAM 2 — KITCHEN', danger:0.33},
  {name:'CAM 3 — STORAGE', danger:0.33}
];
const NIGHT_LENGTH_SEC = 240; // real seconds to reach 6AM

const $ = id => document.getElementById(id);
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}
function logMsg(msg){
  const el = $('log');
  el.textContent = msg;
  clearTimeout(logMsg._t);
  logMsg._t = setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 3500);
}

/* ============ TITLE / LOBBY ============ */
function randCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<4;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function myName(){
  return ($('name-input').value || '').trim().slice(0,10) || '警備員';
}

$('btn-create').onclick = async ()=>{
  $('title-error').textContent='';
  const code = randCode();
  ROOM = code; MY_SLOT='p1';
  roomRef = db.ref('lateshift_rooms/'+code);
  const initial = {
    hostId: CLIENT_ID,
    status:'waiting',
    outcome:null,
    time:0,
    power:100,
    monster:{stage:0, target:null, cam:null, lastMove:Date.now()},
    doors:{p1:false,p2:false},
    lights:{p1:false,p2:false},
    cams:{p1:false,p2:false},
    players:{ p1:{name:myName(), online:true, ready:false}, p2:null },
    createdAt: Date.now()
  };
  await roomRef.set(initial);
  roomRef.onDisconnect().child('players/p1/online').set(false);
  enterLobby();
};

$('btn-join').onclick = async ()=>{
  $('title-error').textContent='';
  const code = ($('join-code').value||'').trim().toUpperCase();
  if(code.length!==4){ $('title-error').textContent='4桁のコードを入力してください'; return; }
  const ref = db.ref('lateshift_rooms/'+code);
  const snap = await ref.once('value');
  const val = snap.val();
  if(!val){ $('title-error').textContent='その部屋は見つかりません'; return; }
  if(val.players && val.players.p2 && val.players.p2.online){
    $('title-error').textContent='部屋が満員です'; return;
  }
  if(val.status==='playing'){ $('title-error').textContent='すでにゲームが始まっています'; return; }
  ROOM = code; MY_SLOT='p2';
  roomRef = ref;
  await roomRef.child('players/p2').set({name:myName(), online:true, ready:false});
  roomRef.onDisconnect().child('players/p2/online').set(false);
  enterLobby();
};

function enterLobby(){
  show('screen-lobby');
  $('lobby-code').textContent = ROOM;
  if(roomListener) roomRef.off('value', roomListener);
  roomListener = roomRef.on('value', snap=>{
    const v = snap.val();
    if(!v) return;
    latestState = v;
    updateLobbyUI(v);
    if(v.status==='playing'){
      startGameUI();
    }
  });
}

function updateLobbyUI(v){
  const p1 = v.players && v.players.p1;
  const p2 = v.players && v.players.p2;
  $('slot-p1').classList.toggle('online', !!(p1 && p1.online));
  $('slot-p2').classList.toggle('online', !!(p2 && p2.online));
  $('slot-p1-name').textContent = p1 ? (p1.name + (p1.ready?' ✓':'')) : '-';
  $('slot-p2-name').textContent = p2 ? (p2.name + (p2.ready?' ✓':'')) : '未参加';
  const bothReady = p1 && p2 && p1.ready && p2.ready && p1.online && p2.online;
  $('lobby-status').textContent = bothReady ? '間もなく開始します…' : (p2 ? '準備完了を待っています' : '相手の参加を待っています…');
  if(bothReady && MY_SLOT==='p1'){
    roomRef.update({status:'playing', time:0, power:100});
  }
}

$('btn-ready').onclick = ()=>{
  roomRef.child('players/'+MY_SLOT+'/ready').set(true);
  $('btn-ready').disabled = true;
};

$('btn-leave-lobby').onclick = ()=>{
  cleanupRoom();
  show('screen-title');
};

function cleanupRoom(){
  if(roomListener && roomRef) roomRef.off('value', roomListener);
  if(hostLoopHandle) clearInterval(hostLoopHandle);
  hostLoopHandle=null;
  if(roomRef && MY_SLOT){
    roomRef.child('players/'+MY_SLOT+'/online').set(false);
  }
  roomRef=null; ROOM=null; MY_SLOT=null; latestState=null;
}

/* ============ GAME ============ */
function startGameUI(){
  show('screen-game');
  buildCamTabs();
  renderCamView();
  if(!hostLoopHandle && latestState && latestState.hostId===CLIENT_ID){
    hostLoopHandle = setInterval(hostTick, 1000);
  }
}

function buildCamTabs(){
  const wrap = $('cam-tabs');
  wrap.innerHTML='';
  CAMS.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='cam-tab'; b.textContent='CAM '+(i+1);
    b.onclick=()=>{ currentCam=i; renderCamView(); };
    wrap.appendChild(b);
  });
}

/* -------- HOST simulation loop -------- */
function hostTick(){
  if(!latestState || latestState.status!=='playing') return;
  const v = latestState;
  const updates = {};

  // time progression
  const newTime = Math.min(360, v.time + (360/NIGHT_LENGTH_SEC));
  updates.time = newTime;

  // power drain
  let drain = 0.10; // base
  if(v.doors && v.doors.p1) drain += 0.16;
  if(v.doors && v.doors.p2) drain += 0.16;
  if(v.cams && v.cams.p1) drain += 0.05;
  if(v.cams && v.cams.p2) drain += 0.05;
  const newPower = Math.max(0, v.power - drain);
  updates.power = newPower;

  // monster AI
  let m = v.monster || {stage:0,target:null,cam:null,lastMove:0};
  const now = Date.now();
  const moveInterval = 3200 - Math.min(1800, v.time*4); // speeds up as night goes on
  if(now - (m.lastMove||0) > moveInterval){
    m = {...m, lastMove: now};
    if(m.stage===0){
      // start approach toward a random player
      m.target = Math.random()<0.5 ? 'p1':'p2';
      m.cam = Math.floor(Math.random()*CAMS.length);
      m.stage = 1;
    } else if(m.stage < 3){
      m.stage += 1;
      m.cam = Math.floor(Math.random()*CAMS.length);
    } else if(m.stage===3){
      // arrives at target's door
      m.stage = 4;
      m.cam = null;
    } else if(m.stage===4){
      const doorClosed = v.doors && v.doors[m.target];
      if(doorClosed){
        // repelled, costs power, resets
        updates.power = Math.max(0, (updates.power!==undefined?updates.power:v.power) - 6);
        m = {stage:0, target:null, cam:null, lastMove:now};
      } else {
        // jumpscare -> lose
        updates.status='over';
        updates.outcome='lose';
        updates.loseTarget=m.target;
      }
    }
  }
  updates.monster = m;

  if(newPower<=0 && updates.status!=='over'){
    updates.status='over';
    updates.outcome='lose';
    updates.loseTarget='blackout';
  }
  if(newTime>=360 && updates.status!=='over'){
    updates.status='over';
    updates.outcome='win';
  }

  roomRef.update(updates);
}

/* -------- render loop driven by DB changes -------- */
function onStateChange(v){
  latestState = v;
  if(!v) return;
  if(v.status==='playing' && !$('screen-game').classList.contains('active')){
    startGameUI();
  }
  if(v.status==='playing'){
    renderHUD(v);
    renderOffice(v);
    if($('cam-view').style.display==='flex') renderCamView(v);
  } else if(v.status==='over'){
    if(hostLoopHandle){ clearInterval(hostLoopHandle); hostLoopHandle=null; }
    showEnd(v);
  }
}

function fmtTime(t){
  // t: 0..360 minutes representing 12:00AM..6:00AM
  const totalMin = Math.floor(t);
  let hour = Math.floor(totalMin/60); // 0..6
  let min = totalMin%60;
  let displayHour = hour===0?12:hour;
  let ampm = 'AM';
  return `${displayHour}:${String(min).padStart(2,'0')} ${ampm}`;
}

function renderHUD(v){
  $('hud-time').textContent = fmtTime(v.time);
  $('hud-power').textContent = Math.round(v.power)+'%';
  $('hud-power-wrap').classList.toggle('low', v.power<20);
  const partnerSlot = MY_SLOT==='p1'?'p2':'p1';
  const partner = v.players && v.players[partnerSlot];
  $('hud-partner-label').textContent = partnerSlot.toUpperCase();
  $('hud-partner-status').style.color = (partner && partner.online) ? 'var(--phosphor)' : 'var(--danger)';
  $('partner-banner').textContent = (partner && partner.online) ? '' : '⚠ 相方が離脱中 — 一人で両方の扉を守れ';
}

function renderOffice(v){
  const myDoor = v.doors && v.doors[MY_SLOT];
  const partnerSlot = MY_SLOT==='p1'?'p2':'p1';
  const partnerDoor = v.doors && v.doors[partnerSlot];
  $('door-l-shut').setAttribute('opacity', (MY_SLOT==='p1'?myDoor:partnerDoor) ? '0.85':'0');
  $('door-r-shut').setAttribute('opacity', (MY_SLOT==='p1'?partnerDoor:myDoor) ? '0.85':'0');

  const m = v.monster||{};
  const atMyDoor = m.stage===4 && m.target===MY_SLOT;
  const atPartnerDoor = m.stage===4 && m.target===partnerSlot;
  $('doorflash-l').classList.toggle('on', MY_SLOT==='p1'? atMyDoor: atPartnerDoor);
  $('doorflash-r').classList.toggle('on', MY_SLOT==='p1'? atPartnerDoor: atMyDoor);

  $('door-label').textContent = myDoor ? '扉を開ける' : '扉を閉める';
  $('btn-door').classList.toggle('danger-active', atMyDoor);

  // camera tab alert state
  document.querySelectorAll('.cam-tab').forEach((tab,i)=>{
    tab.classList.toggle('alert', m.stage>=1 && m.stage<=3 && m.cam===i);
  });
}

let staticAnimHandle=null;
function drawStatic(){
  const canvas=$('static-canvas');
  if(!canvas.width){ canvas.width=400; canvas.height=260; }
  const ctx=canvas.getContext('2d');
  const imgData=ctx.createImageData(canvas.width,canvas.height);
  for(let i=0;i<imgData.data.length;i+=4){
    const g=Math.random()*255;
    imgData.data[i]=g;imgData.data[i+1]=g;imgData.data[i+2]=g;imgData.data[i+3]=255;
  }
  ctx.putImageData(imgData,0,0);
}
function staticLoop(){
  drawStatic();
  staticAnimHandle=requestAnimationFrame(staticLoop);
}

function renderCamView(v){
  v = v||latestState;
  if(!v) return;
  $('cam-name').textContent = CAMS[currentCam].name;
  document.querySelectorAll('.cam-tab').forEach((t,i)=>t.classList.toggle('active', i===currentCam));
  const svg = $('cam-svg');
  // remove previous monster silhouette
  const old = svg.querySelector('#monster-shape');
  if(old) old.remove();
  const m = v.monster||{};
  if(m.stage>=1 && m.stage<=3 && m.cam===currentCam){
    const ns='http://www.w3.org/2000/svg';
    const g=document.createElementNS(ns,'g');
    g.setAttribute('id','monster-shape');
    const scale = 0.6 + m.stage*0.22;
    const cx = 200, cy = 150 - (m.stage*10);
    g.innerHTML = `
      <ellipse cx="${cx}" cy="${cy+40*scale}" rx="${34*scale}" ry="${54*scale}" fill="#04140a" stroke="#0f2b18" stroke-width="2"/>
      <circle cx="${cx}" cy="${cy}" r="${26*scale}" fill="#04140a" stroke="#0f2b18" stroke-width="2"/>
      <circle cx="${cx-9*scale}" cy="${cy-3*scale}" r="${4*scale}" fill="#39d353"/>
      <circle cx="${cx+9*scale}" cy="${cy-3*scale}" r="${4*scale}" fill="#39d353"/>
    `;
    svg.appendChild(g);
  }
}

/* ============ CONTROLS ============ */
$('btn-door').onclick = ()=>{
  if(!latestState) return;
  const cur = !!(latestState.doors && latestState.doors[MY_SLOT]);
  roomRef.child('doors/'+MY_SLOT).set(!cur);
};
$('btn-light').onclick = ()=>{
  if(!latestState) return;
  const cur = !!(latestState.lights && latestState.lights[MY_SLOT]);
  roomRef.child('lights/'+MY_SLOT).set(!cur);
  $('btn-light').classList.toggle('active', !cur);
};
$('btn-cam').onclick = ()=>{
  const camView = $('cam-view');
  const officeView = $('office-view');
  const isOpen = camView.style.display==='flex';
  if(isOpen){
    camView.style.display='none';
    officeView.style.display='flex';
    $('cam-btn-label').textContent='カメラ確認';
    $('btn-cam').classList.remove('active');
    if(staticAnimHandle){ cancelAnimationFrame(staticAnimHandle); staticAnimHandle=null; }
    $('static-canvas').classList.remove('on');
    roomRef.child('cams/'+MY_SLOT).set(false);
  } else {
    camView.style.display='flex';
    officeView.style.display='none';
    $('cam-btn-label').textContent='モニターを閉じる';
    $('btn-cam').classList.add('active');
    $('static-canvas').classList.add('on');
    staticLoop();
    roomRef.child('cams/'+MY_SLOT).set(true);
    renderCamView();
  }
};

/* ============ END SCREEN ============ */
function showEnd(v){
  show('screen-end');
  const win = v.outcome==='win';
  const t = $('end-title');
  t.textContent = win ? 'AM 6:00 — 生存' : 'GAME OVER';
  t.className = win? 'win':'lose';
  if(win){
    $('end-sub').textContent = '夜勤お疲れ様。二人とも朝を迎えた。';
  } else if(v.loseTarget==='blackout'){
    $('end-sub').textContent = '電力切れ。暗闇の中、何かが近づいてくる音がした…';
    triggerJumpscare();
  } else {
    const who = v.loseTarget===MY_SLOT ? 'あなたの' : '相方の';
    $('end-sub').textContent = who+'扉が破られた。';
    if(v.loseTarget===MY_SLOT) triggerJumpscare();
  }
}
function triggerJumpscare(){
  const j=$('jumpscare');
  j.classList.add('show');
  setTimeout(()=>j.classList.remove('show'), 700);
}
$('btn-restart').onclick = ()=>{
  cleanupRoom();
  $('btn-ready').disabled=false;
  show('screen-title');
};

/* ============ subscribe to state changes globally once in game ============ */
function attachGameListener(){
  if(!roomRef) return;
  roomRef.off('value', roomListener);
  roomListener = roomRef.on('value', snap=>{ onStateChange(snap.val()); });
}

// override lobby->game transition to attach full listener
const _origEnterLobby = enterLobby;
enterLobby = function(){
  show('screen-lobby');
  $('lobby-code').textContent = ROOM;
  if(roomListener) roomRef.off('value', roomListener);
  roomListener = roomRef.on('value', snap=>{
    const v = snap.val();
    if(!v) return;
    latestState = v;
    if(v.status==='waiting'){
      updateLobbyUI(v);
    } else if(v.status==='playing'){
      attachGameListener();
      startGameUI();
      onStateChange(v);
    }
  });
};
</script>
